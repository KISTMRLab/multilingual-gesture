[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="multilingual-gesture-retrieval"
version="0.1.0"
requires-python=">=3.10"
dependencies=["numpy>=1.24","torch>=2.1","scikit-learn>=1.3","sentence-transformers>=2.2"]
[project.scripts]
multigesture="multilingual_gesture.cli:main"
[tool.setuptools.packages.find]
where=["src"]

